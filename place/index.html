  .statgrid>.statcard:nth-child(5){animation-delay:.22s}
  .pgrid>.card{animation:cardRise .46s var(--ease) backwards}
  .pgrid>.card:nth-child(1){animation-delay:.02s}
  .pgrid>.card:nth-child(2){animation-delay:.05s}
  .pgrid>.card:nth-child(3){animation-delay:.08s}
  .pgrid>.card:nth-child(4){animation-delay:.11s}
  .pgrid>.card:nth-child(5){animation-delay:.14s}
  .pgrid>.card:nth-child(6){animation-delay:.17s}
}
@keyframes cardRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* аккуратный индикатор активного раздела в сайдбаре */
.sb-item{position:relative}
.sb-item.active::before{content:'';position:absolute;left:-1px;top:50%;transform:translateY(-50%);
  width:3px;height:18px;border-radius:0 3px 3px 0;background:var(--acc)}

/* ============================================================= */
/* ===== МИКРОАНИМАЦИИ И ПОЛИРОВКА СОСТОЯНИЙ =================== */
/*  Всё завязано на действия пользователя (hover/focus/active) — */
/*  не срабатывает при перерисовке списков.                      */
/* ============================================================= */
/* единый фокус-ринг для клавиатурной навигации */
.chk:focus-visible,.al-chk:focus-visible,.lnk:focus-visible,.chip:focus-visible,
.sbtn:focus-visible,.fchip:focus-visible,.mchip:focus-visible,.qbt:focus-visible,
.thc:focus-visible,.pet-tile:focus-visible{outline:none;box-shadow:0 0 0 3px var(--acc-line)}
/* приятное нажатие и плавная «заливка» чекбоксов */
.chk,.al-chk{transition:background .18s var(--ease),border-color .18s var(--ease),transform .22s var(--spring)}
.chk:active,.al-chk:active{transform:scale(.85)}
/* чипы/пилюли — пружинистый ховер и нажатие */
.chip,.stpill,.delta,.chpill,.cand-c,.dg-badge{transition:transform .2s var(--spring),filter .15s var(--ease),box-shadow .2s var(--ease)}
.stpill:hover{transform:translateY(-1px)}
button.chip:active,.fchip:active,.lnk:active,.mchip:active{transform:scale(.95)}
/* иконки стат-карточек мягко «оживают» при наведении на карту */
.stico{transition:transform .3s var(--spring)}
.statcard:hover .stico{transform:scale(1.08) rotate(-3deg)}
/* стеклянный блик сверху у модалки */
.modal{position:relative}
.modal::before{content:'';position:absolute;left:0;right:0;top:0;height:1px;border-radius:16px 16px 0 0;
  background:linear-gradient(90deg,transparent,var(--glass-brd),transparent);pointer-events:none}
/* пустые состояния — мягкое появление */
.empty{animation:emptyIn .42s var(--ease) backwards}
@keyframes emptyIn{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
/* индикатор «Сохранено» — лёгкая пульсация точки, пока виден */
.savedot.on::before{animation:savePulse 1.7s ease-in-out infinite}
@keyframes savePulse{0%,100%{box-shadow:0 0 0 0 rgba(34,163,102,0)}50%{box-shadow:0 0 0 4px rgba(34,163,102,.18)}}

/* ============================================================= */
/* ===== СМАРТ-НАВИГАЦИЯ: реакции пета на события =============== */
/* ============================================================= */
.pet-badge{position:absolute;top:-4px;right:-4px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:var(--red);color:#fff;font-size:10.5px;font-weight:800;line-height:1;
  display:none;align-items:center;justify-content:center;z-index:2;
  box-shadow:0 0 0 2px var(--bg),0 2px 8px rgba(229,83,75,.5)}
.pet-badge.on{display:flex;animation:petBadgePop .42s var(--spring)}
@keyframes petBadgePop{from{transform:scale(0)}60%{transform:scale(1.18)}to{transform:scale(1)}}
.pp-navbadge{position:absolute;top:5px;right:5px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--red);
  color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 2px var(--surface2)}
.pet-tile:hover .pp-navbadge{box-shadow:none}
.pet-hint,.pet-say{position:absolute;left:calc(100% + 14px);bottom:6px;width:max-content;max-width:230px;
  background:var(--glass-bg);-webkit-backdrop-filter:blur(20px) saturate(1.5);backdrop-filter:blur(20px) saturate(1.5);
  border:1px solid var(--glass-brd);border-radius:14px;box-shadow:var(--shadow-pop);padding:10px 13px;
  font-size:12px;font-weight:600;color:var(--ink);cursor:pointer;line-height:1.4;
  opacity:0;transform:translateX(-10px) scale(.95);transform-origin:0 80%;pointer-events:none;
  transition:opacity .3s var(--ease),transform .42s var(--spring)}
.pet-hint.on,.pet-say.on{opacity:1;transform:none;pointer-events:auto}
.pet-hint::before,.pet-say::before{content:'';position:absolute;left:-5px;bottom:16px;width:11px;height:11px;transform:rotate(45deg);
  background:var(--glass-bg);border-left:1px solid var(--glass-brd);border-bottom:1px solid var(--glass-brd)}
.pet-hint b{color:var(--red-ink);font-weight:800}
body[data-theme=dark] .pet-hint b,body[data-theme=midnight] .pet-hint b{color:#ff8a80}
/* реплика пета — чуть мягче по тону, чем предупреждение */
.pet-say{font-weight:600;color:var(--ink2);border-radius:16px 16px 16px 6px}

/* --- живые микродвижения пета --- */
.pet-face.tilt{animation:petTilt 1.05s var(--ease)}
@keyframes petTilt{0%{transform:rotate(0)}30%{transform:rotate(-7deg)}62%{transform:rotate(4deg)}100%{transform:rotate(0)}}
.pet-face.hop{animation:petHop .62s var(--spring)}
@keyframes petHop{0%{transform:translateY(0)}30%{transform:translateY(-7px) scaleY(1.05)}58%{transform:translateY(0) scaleY(.95)}100%{transform:translateY(0)}}
.pet-face.wiggle{animation:petWiggle .62s ease-in-out}
@keyframes petWiggle{0%,100%{transform:translateX(0) rotate(0)}22%{transform:translateX(-3px) rotate(-3.5deg)}52%{transform:translateX(3px) rotate(3.5deg)}80%{transform:translateX(-2px) rotate(-1.5deg)}}
.pet-face.perk{animation:petPerk .8s var(--spring)}
@keyframes petPerk{0%{transform:scale(1)}34%{transform:scale(1.07) translateY(-3px)}100%{transform:scale(1)}}

/* ============================================================= */
/* ===== СКЕЛЕТ ЗАГРУЗКИ (первичная загрузка сессии) =========== */
/* ============================================================= */
#bootSkeleton{position:fixed;inset:0;z-index:95;display:flex;background:transparent;transition:opacity .42s var(--ease)}
#bootSkeleton.fade{opacity:0;pointer-events:none}
body.booting #authScreen{visibility:hidden}
.sk-shimmer{background:linear-gradient(100deg,var(--surface2) 24%,var(--line) 48%,var(--surface2) 72%);
  background-size:220% 100%;animation:skShim 1.3s linear infinite;border-radius:8px}
@keyframes skShim{from{background-position:220% 0}to{background-position:-220% 0}}
.sk-sb{width:var(--sbw);flex:0 0 var(--sbw);background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));
  border-right:1px solid var(--glass-brd);padding:16px 14px;display:flex;flex-direction:column;gap:20px}
.sk-brand{display:flex;align-items:center;gap:10px}
.sk-logo{width:30px;height:30px;border-radius:9px;flex:0 0 30px}
.sk-navs{display:flex;flex-direction:column;gap:12px;margin-top:6px}
.sk-navrow{display:flex;align-items:center;gap:10px}
.sk-dot{width:18px;height:18px;border-radius:6px;flex:0 0 18px}
.sk-line{height:11px;border-radius:6px;flex:1}
.sk-shell{flex:1;min-width:0;display:flex;flex-direction:column}
.sk-top{height:57px;border-bottom:1px solid var(--glass-brd);background:var(--glass-bg);
  -webkit-backdrop-filter:blur(var(--glass-blur));backdrop-filter:blur(var(--glass-blur));
  display:flex;align-items:center;padding:0 24px}
.sk-search{width:min(420px,40%);height:34px;border-radius:10px}
.sk-main{padding:22px 28px;max-width:1280px;width:100%;margin:0 auto}
.sk-title{width:190px;height:26px;border-radius:8px;display:block;margin-bottom:20px}
.sk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:12px;margin-bottom:18px}
.sk-stat{height:96px;border-radius:14px}
.sk-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr));gap:14px}
.sk-card{height:150px;border-radius:14px}

/* ============================================================= */
/* ===== МОБИЛЬНАЯ ДОВОДКА ==================================== */
/* ============================================================= */
@media(max-width:900px){
  /* тема-попап поднимается над петом, чтобы не перекрывать его */
  .thpop{left:12px;bottom:84px}
  /* облачка пета раскрываются НАД ним (не обрезаются по ширине) */
  .pet-hint,.pet-say{left:0;right:auto;bottom:calc(100% + 12px);transform-origin:0 100%;max-width:min(240px,80vw)}
  .pet-hint::before,.pet-say::before{left:18px;right:auto;bottom:-5px;top:auto;
    border:none;border-right:1px solid var(--glass-brd);border-bottom:1px solid var(--glass-brd)}
  /* меню-панель не шире экрана */
  .pet-panel{width:min(300px,84vw)}
  /* запас снизу, чтобы пет не перекрывал последний элемент списка */
  main{padding-bottom:88px}
  /* скелет: как реальный мобильный шелл — без бокового меню */
  .sk-sb{display:none}
  .sk-main{padding:16px 14px}
  .sk-top{padding:0 14px}
}
/* на узких экранах чуть мягче размытие — экономим GPU на слабых телефонах */
@media(max-width:560px){
  :root{--glass-blur:12px}
}

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" defer onerror="window.__noCharts=true" onload="window.__noCharts=false;if(window.__chartWait){var f=window.__chartWait;window.__chartWait=null;f()}"></script>

<script>
'use strict';

/* ================= КОНСТАНТЫ ================= */
var LS_KEY='paul_indastris_v1';          /* легаси-ключ v10 — используется для переноса старых данных */
/* v11: многопользовательский режим */
var USERS_KEY='pi_users';                /* список аккаунтов */
var SESS_KEY='pi_session';               /* id вошедшего пользователя */
var DIGEST_KEY='pi_digest';              /* общий дайджест (виден всем) */
var CURRENT=null;                        /* текущий пользователь */
function dataKey(){return CURRENT?('pi_data_'+CURRENT.id):LS_KEY}  /* ключ данных текущего пользователя */
var MIN_YM='2026-07', MAX_YM='2027-12';
var MONTHS=['ЯНВАРЬ','ФЕВРАЛЬ','МАРТ','АПРЕЛЬ','МАЙ','ИЮНЬ','ИЮЛЬ','АВГУСТ','СЕНТЯБРЬ','ОКТЯБРЬ','НОЯБРЬ','ДЕКАБРЬ'];
var MONTHS_G=['ЯНВАРЯ','ФЕВРАЛЯ','МАРТА','АПРЕЛЯ','МАЯ','ИЮНЯ','ИЮЛЯ','АВГУСТА','СЕНТЯБРЯ','ОКТЯБРЯ','НОЯБРЯ','ДЕКАБРЯ'];
var SUB_DEFS=[
  {key:'vk',    name:'ВК РЕКЛАМА',     short:'ВК'},
  {key:'promo', name:'ПРОМОСТРАНИЦЫ',  short:'ПРОМО'},
  {key:'tg',    name:'ТГ АДС',         short:'ТГ АДС'}
];
var REPORT_LABELS={'':'', w1:'РАЗ В НЕДЕЛЮ', w2:'РАЗ В 2 НЕДЕЛИ', m1:'РАЗ В МЕСЯЦ', never:'НИКОГДА', custom:'СВОЁ'};
/* статусы направлений — ОБЯЗАТЕЛЬНО объявлены до чтения сохранённых данных (их использует normProject при загрузке) */
var ST={
  active:{cls:'st-a',t:'АКТИВНО'},
  attn:{cls:'st-w',t:'ТРЕБУЕТ ВНИМАНИЯ'},
  problem:{cls:'st-p',t:'ПРОБЛЕМА'},
  idle:{cls:'st-i',t:'НЕ НАЧАТО'}
};
var ST_ORDER=['active','attn','problem','idle'];

/* ================= ХЕЛПЕРЫ ================= */
function $(s){return document.querySelector(s)}
function el(tag,cls,txt){var n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function cmpYM(a,b){return a<b?-1:(a>b?1:0)}
function ymParts(ym){var p=ym.split('-');return{y:Number(p[0]),m:Number(p[1])}}
function ymLabel(ym){var p=ymParts(ym);return MONTHS[p.m-1]+' '+p.y}
function shiftYM(ym,d){var p=ymParts(ym),y=p.y,m=p.m+d;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
function curYM(){var n=new Date();return n.getFullYear()+'-'+String(n.getMonth()+1).padStart(2,'0')}
function clampYM(ym){if(cmpYM(ym,MIN_YM)<0)return MIN_YM;if(cmpYM(ym,MAX_YM)>0)return MAX_YM;return ym}
function fmtMoney(v){var s=(v==null?'':String(v)).trim();var d=s.replace(/[\s\u00A0]/g,'');if(d.length&&/^\d+$/.test(d)){return Number(d).toLocaleString('ru-RU')+' ₽'}return s}
function fmtDate(ts){var d=new Date(ts);return String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear()}
function normalizeUrl(u){u=(u||'').trim();if(!u)return'';if(!/^https?:\/\//i.test(u))u='https://'+u;return u}
function autoTA(t){t.style.height='auto';t.style.height=Math.max(110,t.scrollHeight+4)+'px'}

/* ================= ХРАНИЛИЩЕ ================= */
/* Хранилище: обычно localStorage. Если браузер его блокирует (режим предпросмотра,
   приватная вкладка, песочница) — используем резерв в оперативной памяти, чтобы данные
   не пропадали в течение сессии (вход/выход/дайджест работают). Постоянное сохранение
   на диск возможно только при открытии файла в обычном браузере. */
/* ================= СЕРВЕР (v13) =================
   Все данные живут в базе на хостинге. Здесь — тонкий слой запросов
   к api.php и токен сессии (единственное, что остаётся в браузере). */
var API='api.php';
var SRV_TOKEN=null;try{SRV_TOKEN=localStorage.getItem('place_token')||null}catch(e){}
function tokSave(t){SRV_TOKEN=t||null;try{if(t)localStorage.setItem('place_token',t);else localStorage.removeItem('place_token')}catch(e){}}
function srvCall(action,payload){
  payload=payload||{};payload.action=action;
  if(SRV_TOKEN&&!payload.token)payload.token=SRV_TOKEN;
  return fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)})
    .then(function(r){
      return r.json()['catch'](function(){throw new Error('Сервер вернул некорректный ответ (HTTP '+r.status+'). Проверьте, что api.php загружен и откройте api.php?action=selftest.')})
        .then(function(j){
          if(!r.ok||(j&&j.error)){
            if(j&&j.auth===false)forceRelogin();
            throw new Error((j&&j.error)||('HTTP '+r.status));
          }
          return j;
        });
    },function(){throw new Error('нет соединения')});
}
function forceRelogin(){
  tokSave(null);CURRENT=null;
  try{closeMenu()}catch(e){}
  var ov=$('#overlay');if(ov&&!ov.classList.contains('hidden')){try{closeModal()}catch(e){}}
  document.body.classList.add('noauth');document.body.classList.remove('authed');
  showAuth('Сессия истекла — войдите заново.');
}

function defaultState(){return{months:{},ideas:[],calendar:{},alerts:[],ui:{month:clampYM(curYM()),view:'projects',density:'full',fi:0,theme:'light',accent:'',sec:{},filter:{chans:[],quick:''}}}}
function migrate(s){
  var d=defaultState();
  if(!s||typeof s!=='object')return d;
  s.months=(s.months&&typeof s.months==='object')?s.months:{};
  s.ideas=Array.isArray(s.ideas)?s.ideas:[];
  s.calendar=(s.calendar&&typeof s.calendar==='object')?s.calendar:{};
  s.alerts=Array.isArray(s.alerts)?s.alerts:[];
  s.ui=Object.assign({},d.ui,(s.ui&&typeof s.ui==='object')?s.ui:{});
  if(!s.ui.filter||typeof s.ui.filter!=='object')s.ui.filter={chans:[],quick:''};
  if(!Array.isArray(s.ui.filter.chans))s.ui.filter.chans=[];
  if(typeof s.ui.filter.quick!=='string')s.ui.filter.quick='';
  if(!/^\d{4}-\d{2}$/.test(String(s.ui.month)))s.ui.month=d.ui.month;
  s.ui.month=clampYM(s.ui.month);
  if(['projects','ideas','calendar','digest','alert','trends'].indexOf(s.ui.view)===-1)s.ui.view='projects';
  if(['full','mini','focus'].indexOf(s.ui.density)===-1)s.ui.density='full';
  s.ui.fi=(typeof s.ui.fi==='number'&&isFinite(s.ui.fi))?Math.max(0,Math.floor(s.ui.fi)):0;
  if(['light','dark','glass','aurora','midnight','blue','sand','asphalt'].indexOf(s.ui.theme)===-1)s.ui.theme='light';
  if(typeof s.ui.accent!=='string'||!/^#([0-9a-fA-F]{6})$/.test(s.ui.accent))s.ui.accent='';
  if(!s.ui.sec||typeof s.ui.sec!=='object')s.ui.sec={};
  Object.keys(s.months).forEach(function(ym){
    var md=s.months[ym];
    if(md&&Array.isArray(md.projects))md.projects.forEach(normProject);
  });
  return s;
}
/* v13: реальные данные приходят с сервера в startSession() после входа */
var state=defaultState();

var saveT=null,pushT=null,pushing=false,OFFLINE=false;
var DIRTY={data:false,digest:false,trends:false};
function setDot(mode){
  var d=$('#saveDot');if(!d)return;
  d.classList.remove('err');
  if(mode==='saving'){d.textContent='Сохраняю…';d.classList.add('on')}
  else if(mode==='saved'){d.textContent='Сохранено на сервере';d.classList.add('on');clearTimeout(setDot._t);setDot._t=setTimeout(function(){d.classList.remove('on')},1600)}
  else if(mode==='err'){d.textContent='Не сохранено!';d.classList.add('on');d.classList.add('err')}
}
function setOffline(bad,msg){
  OFFLINE=!!bad;
  var w=$('#storageWarn');if(!w)return;
  if(bad){
    w.textContent='⚠ НЕТ СВЯЗИ С СЕРВЕРОМ ('+(msg||'сеть')+'). Изменения пока не отправлены — не закрывайте вкладку, я повторяю попытки автоматически.';
    w.classList.remove('hidden');
  }else w.classList.add('hidden');
}
function markDirty(k){DIRTY[k]=true;setDot('saving');clearTimeout(pushT);pushT=setTimeout(pushAll,700)}
function pushAll(){
  if(pushing||!CURRENT)return;
  var jobs=[];
  if(DIRTY.data)jobs.push(['save_data',{data:state},'data']);
  if(DIRTY.digest)jobs.push(['save_digest',{digest:DIGEST},'digest']);
  if(DIRTY.trends)jobs.push(['save_trends',{trends:TR},'trends']);
  if(!jobs.length)return;
  pushing=true;
  var chain=Promise.resolve();
  jobs.forEach(function(j){
    chain=chain.then(function(){
      DIRTY[j[2]]=false;
      return srvCall(j[0],j[1])['catch'](function(e){DIRTY[j[2]]=true;throw e});
    });
  });
  chain.then(function(){
    pushing=false;setOffline(false);
    if(DIRTY.data||DIRTY.digest||DIRTY.trends)pushAll();else setDot('saved');
  },function(e){
    pushing=false;setDot('err');setOffline(true,e.message);
    clearTimeout(pushT);pushT=setTimeout(pushAll,5000);
  });
}
function persist(){markDirty('data')}
function save(){clearTimeout(saveT);saveT=setTimeout(persist,250)}
function flushBeacon(){
  if(!CURRENT||!SRV_TOKEN)return;
  clearTimeout(saveT);clearTimeout(pushT);
  var jobs=[];
  if(DIRTY.data)jobs.push({action:'save_data',token:SRV_TOKEN,data:state});
  if(DIRTY.digest)jobs.push({action:'save_digest',token:SRV_TOKEN,digest:DIGEST});
  if(DIRTY.trends)jobs.push({action:'save_trends',token:SRV_TOKEN,trends:TR});
  jobs.forEach(function(p){
    try{fetch(API,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p),keepalive:true})['catch'](function(){})}catch(e){}
  });
}
window.addEventListener('beforeunload',flushBeacon);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flushBeacon()});

/* ============ ПОДТВЕРЖДЕНИЕ В ДВА НАЖАТИЯ + УВЕДОМЛЕНИЯ ============ */
function armBtn(b,normal,armed,fn,ms){
  b.textContent=normal;
  var t=null;
  function reset(){b.classList.remove('armed');b.textContent=normal;t=null}
  b.onclick=function(e){
    if(e)e.stopPropagation();
    if(b.classList.contains('armed')){clearTimeout(t);reset();fn();return}
    b.classList.add('armed');b.textContent=armed;
    clearTimeout(t);t=setTimeout(reset,ms||3500);
  };
}
var toastT=null;
function toast(msg,err,ms){
  var t=document.getElementById('toast');
  if(!t){t=el('div','toast');t.id='toast';document.body.appendChild(t)}
  t.textContent=msg;
  t.className='toast show'+(err?' err':'');
  clearTimeout(toastT);
  toastT=setTimeout(function(){t.className='toast'},ms||3000);
}
function subMeta(sb){return ST[sb.status]||ST.active}
function touch(p){p.updated=Date.now()}
function hist(p,msg){
  if(!Array.isArray(p.hist))p.hist=[];
  var last=p.hist[0];
  if(last&&last.msg===msg&&Date.now()-last.t<120000){last.t=Date.now()}
  else p.hist.unshift({t:Date.now(),msg:msg});
  if(p.hist.length>30)p.hist.length=30;
}
function pad2(n){return String(n).padStart(2,'0')}
function fmtRel(t){
  if(!t)return '';
  var d=new Date(t),n=new Date();
  var hm=pad2(d.getHours())+':'+pad2(d.getMinutes());
  if(d.toDateString()===n.toDateString())return 'сегодня '+hm;
  var y=new Date(n.getFullYear(),n.getMonth(),n.getDate()-1);
  if(d.toDateString()===y.toDateString())return 'вчера '+hm;
  return pad2(d.getDate())+'.'+pad2(d.getMonth()+1)+' '+hm;
}
function fillInfo(p){
  var items=[
    ['название',String(p.name||'').trim()],
    ['МП',String(p.mp||'').trim()],
    ['бюджет',String(p.budget||'').trim()],
    ['план ЦО',String(p.co||'').trim()],
    ['ссылки',String(p.linkCreatives||'').trim()||String(p.linkTexts||'').trim()],
    ['отчётность',(p.report&&p.report.preset)?'1':''],
    ['след. действие',String(p.next||'').trim()],
    ['заметки',String(p.notes||'').trim()],
    ['цели',String(p.goals||'').trim()],
    ['креативы',(Array.isArray(p.creatives)&&p.creatives.length)?'1':'']
  ];
  var missing=[],done=0;
  items.forEach(function(it){if(it[1])done++;else missing.push(it[0])});
  return{pct:Math.round(done/items.length*100),missing:missing};
}
function viewProjects(md){
  var a=md.projects.slice();
  a.sort(function(x,y){return (y.pinned?1:0)-(x.pinned?1:0)});
  return a;
}
function togglePin(p){
  p.pinned=!p.pinned;touch(p);
  hist(p,p.pinned?'Проект закреплён':'Закрепление снято');
  save();renderView();
  toast(p.pinned?'Закреплён — теперь показывается первым':'Откреплён');
}
function normProject(p){
  if(!p||typeof p!=='object')return p;
  if(typeof p.pinned!=='boolean')p.pinned=false;
  if(typeof p.next!=='string')p.next='';
  if(typeof p.updated!=='number')p.updated=0;
  if(!Array.isArray(p.hist))p.hist=[];
  if(Array.isArray(p.subs))p.subs.forEach(function(sb){
    if(sb.status==='late')sb.status='attn';
    else if(sb.status==='none')sb.status='problem';
    if(ST_ORDER.indexOf(sb.status)===-1)sb.status='active';
    if(typeof sb.late!=='string')sb.late='';
  });
  return p;
}
function chipFor(p,sb,click){
  var def=null;
  for(var j=0;j<SUB_DEFS.length;j++)if(SUB_DEFS[j].key===sb.key)def=SUB_DEFS[j];
  var short=(def&&def.short)||sb.name||'';
  var m=subMeta(sb);
  var note=String(sb.late||'').trim();
  var n=el(click?'button':'span','chip '+m.cls,short+(note?' · '+note:''));
  n.title=(sb.name||short)+' — '+m.t+(click?' · клик меняет статус':'');
  if(click)n.onclick=function(e){
    e.stopPropagation();
    var i=ST_ORDER.indexOf(sb.status);
    sb.status=ST_ORDER[(i+1)%ST_ORDER.length];
    touch(p);hist(p,'Направление '+short+': '+subMeta(sb).t.toLowerCase());
    save();renderView();
  };
  return n;
}
var menuEl=null,menuOff=null;
function closeMenu(){
  if(!menuEl)return;
  menuEl.remove();menuEl=null;
  if(menuOff){menuOff();menuOff=null}
}
function openMenu(anchor,items){
  closeMenu();
  var mn=el('div','menu');
  items.forEach(function(it){
    var b=el('button','mi');
    b.appendChild(el('span','ml',it.label));
    if(it.hint)b.appendChild(el('span','mh',it.hint));
    b.onclick=function(e){if(e)e.stopPropagation();closeMenu();it.fn()};
    mn.appendChild(b);
  });
  document.body.appendChild(mn);
  var r=anchor.getBoundingClientRect?anchor.getBoundingClientRect():{top:0,bottom:0,left:0,right:0};
  var vw=window.innerWidth||1000,vh=window.innerHeight||800;
  var mw=mn.offsetWidth||250,mh=mn.offsetHeight||130;
  var left=Math.max(8,Math.min(r.right-mw,vw-mw-8));
  var top=r.bottom+6;
  if(top+mh>vh-8)top=Math.max(8,r.top-mh-6);
  mn.style.left=left+'px';mn.style.top=top+'px';
  menuEl=mn;
  function onDoc(e){if(menuEl&&!menuEl.contains(e.target)&&e.target!==anchor)closeMenu()}
  function onAny(){closeMenu()}
  document.addEventListener('mousedown',onDoc);
  window.addEventListener('resize',onAny);
  window.addEventListener('scroll',onAny,true);
  menuOff=function(){
    document.removeEventListener('mousedown',onDoc);
    window.removeEventListener('resize',onAny);
    window.removeEventListener('scroll',onAny,true);
  };
}

/* ================= ДАННЫЕ ПРОЕКТОВ ================= */
function monthData(ym){if(!state.months[ym])state.months[ym]={projects:[]};if(!Array.isArray(state.months[ym].projects))state.months[ym].projects=[];return state.months[ym]}
function newProject(){
  return{
    id:uid(),name:'',logo:null,mp:'',budget:'',co:'',
    linkCreatives:'',linkTexts:'',
    report:{preset:'',custom:''},
    notes:'',goals:'',creatives:[],
    next:'',pinned:false,updated:Date.now(),hist:[],
    subs:SUB_DEFS.map(function(s){return{key:s.key,name:s.name,status:'active',late:''}})
  };
}
function subsOf(p){
  if(!Array.isArray(p.subs)||!p.subs.length){
    p.subs=SUB_DEFS.map(function(s){return{key:s.key,name:s.name,status:'active',late:''}});
  }
  return p.subs;
}
function reportText(p){
  var r=(p.report&&typeof p.report==='object')?p.report:{preset:''};
  if(r.preset==='custom')return String(r.custom||'').trim().toUpperCase()||'СВОЁ';
  return REPORT_LABELS[r.preset]||'';
}
function findProject(id){
  var md=monthData(state.ui.month);
  for(var i=0;i<md.projects.length;i++)if(md.projects[i].id===id)return md.projects[i];
  return null;
}

/* ================= РЕНДЕР: КАРКАС ================= */
function renderApp(){
  hideQ();
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].dataset.view===state.ui.view);
  var noMonth=(state.ui.view==='ideas'||state.ui.view==='digest'||state.ui.view==='alert'||state.ui.view==='trends');
  $('#monthbar').classList.toggle('hidden',noMonth);
  $('#mLabel').textContent=ymLabel(state.ui.month);
  $('#mPrev').disabled=cmpYM(state.ui.month,MIN_YM)<=0;
  $('#mNext').disabled=cmpYM(state.ui.month,MAX_YM)>=0;
  updateAlertTab();
  renderView();
}
function renderView(){
  closeMenu();
  if(window._trChart){try{window._trChart.destroy()}catch(e){}window._trChart=null}
  var v=$('#view');v.innerHTML='';
  if(state.ui.view==='projects')renderProjects(v);
  else if(state.ui.view==='ideas')renderIdeas(v);
  else if(state.ui.view==='calendar')renderCalendar(v);
  else if(state.ui.view==='digest')renderDigest(v);
  else if(state.ui.view==='alert')renderAlert(v);
  else if(state.ui.view==='trends')renderTrends(v);
  else renderProjects(v);
}

/* ================= ПРОЕКТЫ ================= */
function renderProjects(root){
  var ym=state.ui.month, md=monthData(ym);
  root.appendChild(pageHead('Проекты','Рабочие проекты месяца · '+ymLabel(ym).toLowerCase()));
  var tb=el('div','toolbar');
  var bNew=el('button','btn acc','+ СОЗДАТЬ ПРОЕКТ');
  bNew.onclick=function(){resetFilter();var p=newProject();md.projects.push(p);state.ui.fi=visibleProjects(md).length-1;save();renderView();openProject(p.id)};
  tb.appendChild(bNew);

  var prev=shiftYM(ym,-1);
  var prevHas=cmpYM(prev,MIN_YM)>=0&&state.months[prev]&&Array.isArray(state.months[prev].projects)&&state.months[prev].projects.length>0;
  if(prevHas){
    var bCopy=el('button','btn');
    bCopy.title='Скопировать карточки проектов из прошлого месяца (нажать два раза)';
    armBtn(bCopy,'⟳ ПЕРЕНЕСТИ ИЗ '+ymLabel(prev),'ПЕРЕНЕСТИ — ТОЧНО?',copyPrev);
    tb.appendChild(bCopy);
  }
  var vs=el('div','seg vseg');
  function vbtn(key,label,title){
    var b=el('button','sbtn'+(state.ui.density===key?' on':''),label);
    b.title=title;
    b.onclick=function(){state.ui.density=key;save();renderView()};
    vs.appendChild(b);
  }
  vbtn('mini','▦ ОБЗОР','Компактные карточки — быстрый взгляд на все проекты сразу');
  vbtn('full','☰ ПОДРОБНО','Полные карточки со всеми полями');
  vbtn('focus','▣ 1 ПРОЕКТ','Один проект на весь экран со всеми деталями, листание стрелками');
  tb.appendChild(vs);
  var vpAll=viewProjects(md);
  var vp=applyProjectFilter(vpAll);
  var cntEl=el('div','count','ПРОЕКТОВ: '+(vp.length===vpAll.length?md.projects.length:(vp.length+' / '+md.projects.length)));
  tb.appendChild(cntEl);
  root.appendChild(tb);
  if(md.projects.length)root.appendChild(projStatCards(md,ym));

  if(!md.projects.length){
    var e=el('div','empty');
    e.appendChild(el('b',null,'НЕТ ПРОЕКТОВ НА '+ymLabel(ym)));
    e.appendChild(el('div',null,'Нажми «+ Создать проект» — карточка появится здесь. У каждого месяца свой набор карточек.'));
    root.appendChild(e);
    return;
  }

  root.appendChild(buildFilterBar());

  if(!vp.length){
    var ef=el('div','empty');

function loadLogo(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MX=240,w=img.width,h=img.height;
      var k=Math.min(1,MX/Math.max(w,h,1));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      var url;
      try{
        url=(file.type==='image/png'||file.type==='image/svg+xml')?cv.toDataURL('image/png'):cv.toDataURL('image/jpeg',0.85);
      }catch(e){url=rd.result}
      cb(url);
    };
    img.onerror=function(){toast('Не удалось прочитать изображение. Подойдут PNG или JPG.',true)};
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function loadCreative(file,cb){
  var rd=new FileReader();
  rd.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MX=1100,w=img.width,h=img.height;
      var k=Math.min(1,MX/Math.max(w,h,1));
      w=Math.max(1,Math.round(w*k));h=Math.max(1,Math.round(h*k));
      var cv=document.createElement('canvas');cv.width=w;cv.height=h;
      var ctx=cv.getContext('2d');ctx.fillStyle='#ffffff';ctx.fillRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);
      var url;try{url=cv.toDataURL('image/jpeg',0.85)}catch(e){url=rd.result}
      cb(url);
    };
    img.onerror=function(){toast('Не удалось прочитать «'+(file.name||'файл')+'». Подойдут PNG или JPG.',true)};
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}

/* ================= ПЕРЕНОС ИЗ ПРОШЛОГО МЕСЯЦА ================= */
function cloneProject(p){
  var c=JSON.parse(JSON.stringify(p));
  c.id=uid();
  if(Array.isArray(c.creatives))c.creatives.forEach(function(cr){cr.id=uid()});
  c.updated=Date.now();
  c.hist=[{t:Date.now(),msg:'Создан как копия'}];
  return c;
}
function duplicateHere(p){
  var md=monthData(state.ui.month);
  var i=md.projects.indexOf(p);
  var c=cloneProject(p);
  c.name=(fdash(p.name)||'НОВЫЙ ПРОЕКТ')+' (копия)';
  md.projects.splice(i<0?md.projects.length:i+1,0,c);
  save();renderView();
  toast('Копия создана: «'+c.name+'»');
}
function duplicateTo(p,months){
  var nm=String(p.name||'').trim().toLowerCase();
  var done=[],skip=[];
  months.forEach(function(ym){
    var md=monthData(ym);
    var exists=nm&&md.projects.some(function(x){return String(x.name||'').trim().toLowerCase()===nm});
    if(exists){skip.push(ymLabel(ym).toLowerCase());return}
    md.projects.push(cloneProject(p));
    done.push(ymLabel(ym).toLowerCase());
  });
  save();
  var msg=done.length?('Скопировано: '+done.join(', ')):'Ничего не скопировано';
  if(skip.length)msg+=' · пропущено (уже есть): '+skip.join(', ');
  toast(msg,!done.length,4500);
}
function openProjectMenu(anchor,p){
  var nxt=shiftYM(state.ui.month,1);
  var items=[{label:'⧉ Дублировать в этот месяц',hint:'Копия появится рядом — удобно, чтобы разветвить проект',fn:function(){duplicateHere(p)}}];
  if(cmpYM(nxt,MAX_YM)<=0){
    items.push({label:'→ Дублировать в '+ymLabel(nxt),hint:'Проект со всеми данными появится в следующем месяце',fn:function(){duplicateTo(p,[nxt])}});
    items.push({label:'⧉ Дублировать в несколько месяцев…',hint:'Выбрать сразу несколько месяцев вперёд',fn:function(){openMultiCopy(p)}});
  }
  openMenu(anchor,items);
}

function buildMultiCopyModal(m,p){
  var head=el('div','mhead');
  head.appendChild(el('div','dtitle','ДУБЛИРОВАТЬ «'+(fdash(p.name)||'БЕЗ НАЗВАНИЯ')+'»'));
  var sp=el('div');sp.style.flex='1';
  var x=el('button','btn sq','✕');x.title='Закрыть';x.onclick=closeModal;
  head.appendChild(sp);head.appendChild(x);

  var sec=el('div','sec');

  var grid=el('div','mgrid');
  var sel={},chips=[];
  var go=el('button','btn acc','СКОПИРОВАТЬ');
  function syncGo(){var n=Object.keys(sel).length;go.textContent=n?'СКОПИРОВАТЬ В '+n+' МЕС.':'СКОПИРОВАТЬ';go.disabled=!n}
  var ym=shiftYM(state.ui.month,1);
  while(cmpYM(ym,MAX_YM)<=0){
    (function(ym){
      var b=el('button','mchip',ymLabel(ym));
      b.onclick=function(){
        var on=b.classList.toggle('on');
        if(on)sel[ym]=1;else delete sel[ym];
        syncGo();
      };
      chips.push({ym:ym,b:b});
      grid.appendChild(b);
    })(ym);
    ym=shiftYM(ym,1);
  }
  sec.appendChild(grid);m.appendChild(sec);
  var f=el('div','mfoot');
  var all=el('button','btn sm','ОТМЕТИТЬ ВСЕ');
  all.onclick=function(){
    var everything=chips.length&&Object.keys(sel).length===chips.length;
    chips.forEach(function(c){
      if(everything){c.b.classList.remove('on');delete sel[c.ym]}
      else{c.b.classList.add('on');sel[c.ym]=1}
    });
    all.textContent=everything?'ОТМЕТИТЬ ВСЕ':'СНЯТЬ ВСЕ';
    syncGo();
  };
  var cancel=el('button','btn','ОТМЕНА');cancel.onclick=closeModal;
  go.onclick=function(){
    var months=Object.keys(sel).sort();
    closeModal();
    duplicateTo(p,months);
  };
  syncGo();
  f.appendChild(all);f.appendChild(el('div','hspacer'));f.appendChild(cancel);f.appendChild(go);
  m.appendChild(f);
}
function copyPrev(){
  var ym=state.ui.month,prev=shiftYM(ym,-1);
  var pd=state.months[prev];
  if(!pd||!Array.isArray(pd.projects)||!pd.projects.length)return;
  var md=monthData(ym);
  var have={};
  md.projects.forEach(function(p){have[String(p.name||'').trim().toLowerCase()]=1});
  var list=pd.projects.filter(function(p){return !have[String(p.name||'').trim().toLowerCase()]});
  if(!list.length){toast('Все проекты из '+ymLabel(prev)+' уже есть в этом месяце');return}
  list.forEach(function(p){md.projects.push(cloneProject(p))});
  save();renderView();toast('Перенесено проектов: '+list.length);
}

function renderCalendar(root){
  var ym=state.ui.month,p=ymParts(ym),y=p.y,m=p.m;
  root.appendChild(pageHead('Календарь','Задачи по дням · '+ymLabel(ym).toLowerCase()));
  var wrap=el('div','cal');
  var hd=el('div','cal-head');
  ['ПН','ВТ','СР','ЧТ','ПТ','СБ','ВС'].forEach(function(w,i){hd.appendChild(el('div','wd'+(i>4?' we':''),w))});
  wrap.appendChild(hd);

  var g=el('div','cal-grid');
  var first=new Date(y,m-1,1);
  var off=(first.getDay()+6)%7;
  var dim=new Date(y,m,0).getDate();
  var now=new Date();
  var isThisMonth=(now.getFullYear()===y&&now.getMonth()===m-1);

  for(var i=0;i<off;i++)g.appendChild(el('div','day blank'));
  for(var d=1;d<=dim;d++){
    (function(d){
      var ds=ym+'-'+String(d).padStart(2,'0');
      var cell=el('div','day'+(isThisMonth&&now.getDate()===d?' today':''));
      cell.appendChild(el('div','dnum',String(d)));
      var tasks=state.calendar[ds]||[];
      if(tasks.length){
        var done=tasks.filter(function(t){return t.done}).length;
        cell.appendChild(el('div','cnt'+(done===tasks.length?' alldone':''),done+'/'+tasks.length));
        tasks.slice(0,2).forEach(function(t){var u=(t.urgent&&!t.done);cell.appendChild(el('div','mini'+(t.done?' done':'')+(u?' urg':''),(u?'🚨 ':'')+String(t.text||'…')))});
        if(tasks.length>2)cell.appendChild(el('div','mini more','+ ЕЩЁ '+(tasks.length-2)));
      }
      cell.onclick=function(){openDay(ds)};
      g.appendChild(cell);
    })(d);
  }
  var total=off+dim,rem=total%7;
  if(rem)for(var k=rem;k<7;k++)g.appendChild(el('div','day blank'));
  wrap.appendChild(g);
  root.appendChild(wrap);
  root.appendChild(el('div','calhint','Нажми на день, чтобы добавить или посмотреть задачи. Метка в углу — счётчик задач.'));
}

function dayTitle(ds){
  var a=ds.split('-');
  return Number(a[2])+' '+MONTHS_G[Number(a[1])-1]+' '+a[0];
}
function openDay(ds){
  modalOnClose=function(){save();renderView()};
  openModal(function(m){buildDayModal(m,ds)});
}
function buildDayModal(m,ds){
  var head=el('div','mhead');
  head.appendChild(el('div','dtitle',dayTitle(ds)));
  var sp=el('div');sp.style.flex='1';
  var x=el('button','btn sq','✕');x.title='Закрыть';x.onclick=closeModal;
  head.appendChild(sp);head.appendChild(x);
  m.appendChild(head);

  var sec=el('div','sec');
  sec.appendChild(el('div','sect','ЗАДАЧИ НА ДЕНЬ'));
  var list=el('div','tlist');sec.appendChild(list);

  function tasks(){return state.calendar[ds]||[]}
  function setTasks(a){if(a.length)state.calendar[ds]=a;else delete state.calendar[ds];save()}

  function redraw(){
    list.innerHTML='';
    var a=tasks();
    if(!a.length){list.appendChild(el('div','tempty','ЗАДАЧ НЕТ — ДОБАВЬ ПЕРВУЮ НИЖЕ'));return}
    a.forEach(function(t){
      if(!t.id)t.id=uid();
      var r=el('div','trow'+(t.done?' done':''));
      var ch=el('button','chk'+(t.done?' done':''),t.done?'✓':'');
      ch.title='Отметить выполненной';
      ch.onclick=function(){t.done=!t.done;save();redraw()};
      var inp=document.createElement('input');
      inp.className='in';inp.value=t.text||'';inp.placeholder='Текст задачи…';
      inp.oninput=function(){t.text=inp.value;save()};
      var ub=el('button','urgbtn'+(t.urgent?' on':''),'🚨');
      ub.title=t.urgent?'Снять отметку «срочно»':'Пометить как срочную — попадёт в раздел ALERT';
      ub.onclick=function(){t.urgent=!t.urgent;save();redraw();updateAlertTab()};
      var del=el('button','del','✕');del.title='Удалить задачу';
      del.onclick=function(){setTasks(tasks().filter(function(xx){return xx.id!==t.id}));redraw()};
      r.appendChild(ch);r.appendChild(inp);r.appendChild(ub);r.appendChild(del);
      list.appendChild(r);
    });
  }
  redraw();

  var add=el('div','trow addrow');
  var ai=document.createElement('input');
  ai.className='in';ai.placeholder='Новая задача… (Enter — добавить)';
  var ab=el('button','btn acc','ДОБАВИТЬ');
  function doAdd(){
    var v=ai.value.trim();if(!v)return;
    var a=tasks().slice();a.push({id:uid(),text:v,done:false});
    setTasks(a);ai.value='';redraw();ai.focus();
  }
  ab.onclick=doAdd;
  ai.addEventListener('keydown',function(e){if(e.key==='Enter')doAdd()});
  add.appendChild(ai);add.appendChild(ab);
  sec.appendChild(add);
  m.appendChild(sec);

  var f=el('div','mfoot');
  f.appendChild(el('span','autosave','ВСЁ СОХРАНЯЕТСЯ АВТОМАТИЧЕСКИ'));
  var ok=el('button','btn acc','ГОТОВО');ok.onclick=closeModal;
  f.appendChild(ok);
  m.appendChild(f);
  setTimeout(function(){ai.focus()},60);
}

function goToProject(ym,id){

function searchAll(q){
  q=String(q||'').trim().toLowerCase();
  if(!q)return[];
  var res=[];
  Object.keys(state.months).sort().forEach(function(ym){
    var md=state.months[ym];
    ((md&&md.projects)||[]).forEach(function(p){
      var hay=[p.name,p.mp,p.next,p.notes,p.goals,p.co,p.linkCreatives,p.linkTexts]
        .concat((p.creatives||[]).map(function(cr){return cr.cap})).join(' ').toLowerCase();
      if(hay.indexOf(q)>=0)res.push({t:'ПРОЕКТ',l:fdash(p.name)||'без названия',s:ymLabel(ym).toLowerCase(),go:function(){goToProject(ym,p.id)}});
    });
  });
  state.ideas.forEach(function(i){
    if(((i.title||'')+' '+(i.text||'')).toLowerCase().indexOf(q)>=0)
      res.push({t:'ИДЕЯ',l:fdash(i.title)||'без заголовка',s:fmtDate(i.created||Date.now()),go:function(){state.ui.view='ideas';save();renderApp()}});
  });
  Object.keys(state.calendar).sort().forEach(function(ds){
    (state.calendar[ds]||[]).forEach(function(tk){
      if(String(tk.text||'').toLowerCase().indexOf(q)>=0)
        res.push({t:'ЗАДАЧА',l:tk.text||'…',s:dayTitle(ds).toLowerCase(),go:function(){
          state.ui.view='calendar';state.ui.month=clampYM(ds.slice(0,7));save();renderApp();openDay(ds);
        }});
    });
  });
  ((typeof DIGEST!=='undefined'&&DIGEST&&DIGEST.entries)||[]).forEach(function(en){

document.addEventListener('keydown',function(e){
  var tg=e.target&&e.target.tagName;
  var typing=(tg==='INPUT'||tg==='TEXTAREA'||tg==='SELECT');
  if(e.key==='/'&&!typing){
    e.preventDefault();
    var q=$('#q');if(q){q.focus();if(q.select)q.select()}
    return;
  }
  if(typing)return;
  if(lbEl||menuEl)return;
  if(!$('#overlay').classList.contains('hidden'))return;
  if((e.ctrlKey||e.metaKey)&&(e.key==='d'||e.key==='D'||e.key==='в'||e.key==='В')){
    if(state.ui.view==='projects'&&state.ui.density==='focus'){
      var l=visibleProjects(monthData(state.ui.month));
      var p=l[state.ui.fi|0];
      if(p){e.preventDefault();duplicateHere(p)}
    }
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='n'||e.key==='N'||e.key==='т'||e.key==='Т'){
    if(state.ui.view==='projects'){

      state.ui.fi=visibleProjects(md).length-1;

  if(e.key==='e'||e.key==='E'||e.key==='у'||e.key==='У'){
    if(state.ui.view==='projects'&&state.ui.density==='focus'){
      var l2=visibleProjects(monthData(state.ui.month));

function collectAlertTasks(){
  var today=todayStr();
  var over=[],tod=[],urg=[];
  Object.keys(state.calendar).forEach(function(ds){
    (state.calendar[ds]||[]).forEach(function(t){
      if(t.done)return;
      if(ds<today)over.push({ds:ds,t:t});
      else if(ds===today)tod.push({ds:ds,t:t});
      else if(t.urgent)urg.push({ds:ds,t:t});
    });
  });
  function bydate(a,b){return a.ds.localeCompare(b.ds)}
  over.sort(bydate);tod.sort(bydate);urg.sort(bydate);
  return {over:over,tod:tod,urg:urg};
}
function collectProblemProjects(){

function isoWeek(ds){

  var day=(d.getUTCDay()+6)%7;

  var firstThu=new Date(Date.UTC(d.getUTCFullYear(),0,4));

    acts.appendChild(ed);acts.appendChild(dl);

function renderDigest(root){
  root.appendChild(pageHead('Дайджест','Новости, кейсы и недельные сводки · общий раздел для всей команды'));
  var tb=el('div','toolbar');
  if(isAdmin()){
    var b=el('button','btn acc','+ НОВАЯ ЗАПИСЬ');
    b.onclick=function(){openDigestEditor(null)};
    tb.appendChild(b);
  }else{
    tb.appendChild(el('div','dg-badge','📢 Только чтение · записи ведут администраторы'));
  }
  tb.appendChild(el('div','count','ЗАПИСЕЙ: '+DIGEST.entries.length));
  root.appendChild(tb);

  if(!DIGEST.entries.length){
    var e=el('div','empty');
    e.appendChild(el('b',null,'ДАЙДЖЕСТ ПОКА ПУСТ'));
    e.appendChild(el('div',null,isAdmin()?'Нажми «+ Новая запись», чтобы опубликовать первую новость или сводку.':'Здесь будут появляться новости и сводки от администраторов.'));
    root.appendChild(e);
    return;
  }
  var list=DIGEST.entries.slice().sort(function(a,b){
    var da=a.date||'',db=b.date||'';
    if(da!==db)return db.localeCompare(da);
    return (b.created||0)-(a.created||0);
  });
  var lastYear=null,lastWeek=null;
  list.forEach(function(en){
    var base=/^\d{4}-\d{2}-\d{2}$/.test(String(en.date))?en.date:todayStr();
    var iw=isoWeek(base);
    if(iw.year!==lastYear){root.appendChild(el('div','dg-year',String(iw.year)));lastYear=iw.year;lastWeek=null}
    if(iw.week!==lastWeek){root.appendChild(el('div','dg-week','НЕДЕЛЯ '+iw.week));lastWeek=iw.week}
    root.appendChild(digestCard(en));
  });
}
function openDigestEditor(entry){
  if(!isAdmin())return;
  modalOnClose=null;
  var editing=!!entry;
  openModal(function(m){
    var head=el('div','mhead');
    head.appendChild(el('div','dtitle',editing?'РЕДАКТИРОВАТЬ ЗАПИСЬ':'НОВАЯ ЗАПИСЬ ДАЙДЖЕСТА'));
    var sp=el('div');sp.style.flex='1';
    var x=el('button','btn sq','✕');x.title='Закрыть';x.onclick=closeModal;
    head.appendChild(sp);head.appendChild(x);
    m.appendChild(head);

    var sec=el('div','sec');
    var di=document.createElement('input');di.type='date';di.className='in';di.value=(editing&&/^\d{4}-\d{2}-\d{2}$/.test(String(entry.date)))?entry.date:todayStr();
    sec.appendChild(field('ДАТА ПУБЛИКАЦИИ',di));
    var ti=document.createElement('input');ti.className='in';ti.placeholder='Заголовок: новость, объявление, сводка недели…';ti.value=editing?(entry.title||''):'';
    sec.appendChild(field('ЗАГОЛОВОК',ti));
    var ta=document.createElement('textarea');ta.className='ta';ta.placeholder='Описание: что произошло, что важно, детали кейса…';ta.value=editing?(entry.body||''):'';ta.style.minHeight='150px';
    sec.appendChild(field('ОПИСАНИЕ',ta));
    m.appendChild(sec);

    var err=el('div','autherr');sec.appendChild(err);
    function fail(msg){err.textContent=msg;err.classList.add('show')}

    var f=el('div','mfoot');
    var hint=el('span','autosave','ВИДНО ВСЕМ ПОЛЬЗОВАТЕЛЯМ');
    var cancel=el('button','btn','ОТМЕНА');cancel.onclick=closeModal;
    var ok=el('button','btn acc',editing?'СОХРАНИТЬ':'ОПУБЛИКОВАТЬ');
    ok.onclick=function(){
      var title=ti.value.trim(),body=ta.value,date=di.value||todayStr();
      if(!title){fail('Введите заголовок записи');ti.focus();return}
      if(editing){
        entry.title=title;entry.body=body;entry.date=date;entry.updated=Date.now();
      }else{
        DIGEST.entries.push({id:uid(),date:date,title:title,body:body,author:(CURRENT.name||CURRENT.login),authorId:CURRENT.id,created:Date.now(),updated:Date.now()});
      }
      saveDigest();closeModal();state.ui.view='digest';renderApp();
      toast(editing?'Запись обновлена ✓':'Запись опубликована ✓');
    };
    f.appendChild(hint);f.appendChild(cancel);f.appendChild(ok);
    m.appendChild(f);
    setTimeout(function(){ti.focus()},60);
  });
}

function startSession(b){
  CURRENT=b.user;tokSave(b.token||SRV_TOKEN);
  state=migrate(b.data);
  DIGEST=dgMigrate(b.digest);
  TR=trMigrate(b.trends);
  if(b.ws&&typeof b.ws==='object')WS_STATUS=b.ws;
  DIRTY.data=false;DIRTY.digest=false;DIRTY.trends=false;
  maybeSeedDemo();
  document.body.classList.remove('noauth');document.body.classList.add('authed');
  var as=$('#authScreen');if(as)as.classList.add('hidden');
  setOffline(false);
  applyTheme();buildUserBox();
  renderApp();
}
function logout(){
  flushBeacon();
  var t=SRV_TOKEN;tokSave(null);
  if(t)srvCall('logout',{token:t})['catch'](function(){});
  closeMenu();
  var ov=$('#overlay');if(ov&&!ov.classList.contains('hidden'))closeModal();
  CURRENT=null;
  document.body.classList.add('noauth');document.body.classList.remove('authed');
  var ub=$('#userBox');if(ub)ub.innerHTML='';
  showAuth();
}
function doLogin(login,pass,done){
  srvCall('login',{login:String(login||'').trim(),pass:String(pass||'')})
    .then(function(b){startSession(b);if(done)done(null)},
          function(e){if(done)done(e.message)});
}
function showAuth(msg,info){buildAuthScreen(msg,info);var as=$('#authScreen');if(as)as.classList.remove('hidden')}
function buildAuthScreen(preMsg,info){
  var host=$('#authScreen');if(!host)return;host.innerHTML='';
  var card=el('div','authcard');
  card.appendChild(el('div','authbrand','Place'));
  card.appendChild(el('div','authsub','Рабочие проекты · вход в кабинет'));

  var err=el('div','autherr');
  var okb=el('div','authok');
  function fail(msg){okb.classList.remove('show');err.textContent=msg;err.classList.add('show')}
  function inform(msg){err.classList.remove('show');okb.textContent=msg;okb.classList.add('show')}

  var f=el('div','authf');
  var lLogin=document.createElement('input');lLogin.className='in';lLogin.placeholder='логин';lLogin.autocomplete='username';
  var lPass=document.createElement('input');lPass.className='in';lPass.type='password';lPass.placeholder='пароль';lPass.autocomplete='current-password';
  var bLogin=el('button','btn acc','ВОЙТИ');bLogin.style.marginTop='4px';
  f.appendChild(el('label',null,'Логин'));f.appendChild(lLogin);
  f.appendChild(el('label',null,'Пароль'));f.appendChild(lPass);
  f.appendChild(bLogin);
  function tryLogin(){
    err.classList.remove('show');okb.classList.remove('show');
    bLogin.disabled=true;bLogin.textContent='ВХОЖУ…';
    doLogin(lLogin.value,lPass.value,function(e){
      bLogin.disabled=false;bLogin.textContent='ВОЙТИ';
      if(e)fail(e);
    });
  }
  bLogin.onclick=tryLogin;
  lPass.addEventListener('keydown',function(e){if(e.key==='Enter')tryLogin()});
  lLogin.addEventListener('keydown',function(e){if(e.key==='Enter')lPass.focus()});

  card.appendChild(okb);
  card.appendChild(err);
  card.appendChild(f);

  var note=el('div','authnote');
  note.innerHTML='Данные хранятся на сервере: входите с любого устройства — проекты будут те же. Аккаунты создаёт администратор в меню профиля.';
  card.appendChild(note);

  if(preMsg){if(info)inform(preMsg);else fail(preMsg)}

  host.appendChild(card);
  setTimeout(function(){lLogin.focus()},40);
}

/* мини-спарклайн: столбики недельной динамики (как Latency Trends в референсе) */
function sparkSVG(vals,w,h){
  w=w||118;h=h||24;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+w+' '+h);
  svg.setAttribute('width',w);svg.setAttribute('height',h);
  svg.setAttribute('class','spark');
  var a=(vals||[]).slice(-14);
  if(!a.length)return svg;
  var mx=0;a.forEach(function(v){if(v>mx)mx=v});
  if(!mx)mx=1;
  var med=trMedian(a.slice());
  var n=a.length,bw=Math.max(3,Math.floor((w-(n-1)*2)/n));
  a.forEach(function(v,i){
    var bh=Math.max(2,Math.round(v/mx*(h-2)));
    var r=document.createElementNS('http://www.w3.org/2000/svg','rect');
    r.setAttribute('x',i*(bw+2));r.setAttribute('y',h-bh);
    r.setAttribute('width',bw);r.setAttribute('height',bh);
    r.setAttribute('rx',1.5);
    var col='var(--acc-line)';
    if(med>0&&v>=med*1.06)col='var(--green)';
    else if(med>0&&v<=med*0.8)col='var(--amber)';
    r.setAttribute('fill',col);
    svg.appendChild(r);
  });
  return svg;
}

/* ---------- утилиты дат/математики ---------- */
function trMedian(a){
  a=(a||[]).slice().sort(function(x,y){return x-y});
  if(!a.length)return 0;
  var m=a.length>>1;
  return a.length%2?a[m]:(a[m-1]+a[m])/2;
}
function addDaysISO(iso,days){
  var p=iso.split('-');
  var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  d.setUTCDate(d.getUTCDate()+days);
  return d.getUTCFullYear()+'-'+pad2s(d.getUTCMonth()+1)+'-'+pad2s(d.getUTCDate());
}
function mondayAgo(weeks){
  var n=new Date();
  var d=new Date(Date.UTC(n.getFullYear(),n.getMonth(),n.getDate()));
  var off=(d.getUTCDay()+6)%7;
  d.setUTCDate(d.getUTCDate()-off-weeks*7);
  return d.getUTCFullYear()+'-'+pad2s(d.getUTCMonth()+1)+'-'+pad2s(d.getUTCDate());
}
function trWeekly(id){var s=TR.snap[id];return (s&&Array.isArray(s.weekly))?s.weekly:[]}
function trVol(w){ /* оценка частоты за месяц = сумма последних 4 недель */
  var a=(w||[]).slice(-4),s=0;a.forEach(function(x){s+=Number(x.count)||0});return Math.round(s);
}
function trWow(w,k){ /* прирост неделя-к-неделе, % (k=1 — последняя) */
  var n=w.length;if(n<k+1)return null;
  var a=w[n-k-1],b=w[n-k];
  if(!a||!a.share)return null;
  return Math.round((b.share/a.share-1)*100);
}

/* ---------- статусы и анализ тренда ---------- */
var TRST={
  boom:{t:'ВЗРЫВНОЙ',cls:'s-boom'},
  rising:{t:'РАСТЁТ',cls:'s-rising'},
  emerging:{t:'ОЖИВАЕТ',cls:'s-emerging'},
  stable:{t:'СТАБИЛЕН',cls:'s-stable'},
  falling:{t:'ПАДАЕТ',cls:'s-falling'},
  seasonal:{t:'СЕЗОННЫЙ',cls:'s-seasonal'},
  'new':{t:'МАЛО ДАННЫХ',cls:'s-new'}
};
function trAnalyze(id){
  var w=trWeekly(id);
  var vol=trVol(w);
  if(w.length<6)return{st:'new',g:null,g1:null,yoy:null,vol:vol,score:0};
  var last=w[w.length-1];
  var base=w.slice(Math.max(0,w.length-9),w.length-1).map(function(x){return x.share});
  var med=trMedian(base);
  var g=med?Math.round((last.share/med-1)*100):0;
  var g1=trWow(w,1),g2=trWow(w,2);
  var yoy=null;
  if(w.length>=53){var py=w[w.length-53];if(py&&py.share)yoy=Math.round((last.share/py.share-1)*100)}
  var T=TR.settings.thr,st;
  if(yoy!==null&&g>=T.grow&&Math.abs(yoy)<=20)st='seasonal';
  else if(g>=T.boom&&vol>=T.minVol)st='boom';
  else if(vol<T.minVol&&g>=Math.round(T.grow*0.8))st='emerging';
  else if((g1!==null&&g2!==null&&g1>=T.grow&&g2>=T.grow)||g>=Math.round(T.grow*1.7))st='rising';
  else if(g<=T.fall)st='falling';
  else st='stable';
  var score=Math.round(0.5*g+18*Math.log(vol+1)/Math.LN10+0.3*((g1||0)-(g2||0))+(st==='emerging'?12:0)-(st==='seasonal'?35:0));
  return{st:st,g:g,g1:g1,yoy:yoy,vol:vol,score:score};
}
function trRows(){
  var rows=TR.phrases.map(function(ph){return{ph:ph,a:trAnalyze(ph.id),s:TR.snap[ph.id]||{}}});
  rows.sort(function(x,y){return (y.a.score||0)-(x.a.score||0)});
  return rows;
}

function trRnd(i,seed){var x=Math.sin(i*12.9898+seed*78.233)*43758.5453;return x-Math.floor(x)}
function trGenSeries(kind,base,seed){
  var start=mondayAgo(103),out=[],i;
  var ramp={
    boomA:[1.1,1.25,1.45,1.6,1.82],           /* +73% к медиане 8 недель */
    boomX:[1.15,1.35,1.7,2.1,2.65],           /* взрывной */
    rise:[1.0,1.12,1.35,1.8],                 /* серия недельных +30% */
    fall:[0.93,0.86,0.78,0.7],
    emerg:[1.25,1.6,2.1]
  }[kind]||null;
  for(i=0;i<104;i++){
    var m=1;
    if(kind==='season'){
      var wk=i%52;
      if(wk>=45)m=1+(wk-44)*0.16;
    }
    if(ramp){
      var k=i-(104-ramp.length);
      if(k>=0)m=ramp[k];
    }
    var noise=0.95+0.1*trRnd(i,seed);
    var count=Math.max(5,Math.round(base*m*noise));
    out.push({date:addDaysISO(start,i*7),count:count,share:count/3.2e8*100});
  }
  return out;
}

/* ---------- рекомендации ---------- */
function trRecos(rows){
  var out=[];
  rows.forEach(function(r){
    var a=r.a,p=r.ph.phrase;
    if(a.st==='boom')out.push({tone:'bad',tag:'РЕКЛАМА · СЕЙЧАС',t:'Запускайте кампанию по «'+p+'»',
      s:'Спрос '+fmtSign(a.g)+'% к базе 8 недель при ~'+fmtInt(a.vol)+' запросах/мес. Аукцион обычно отстаёт от таких всплесков — заходите первыми, формулировки для объявлений возьмите из «Топ-запросов».',ph:r.ph});
    if(a.st==='rising')out.push({tone:'ok',tag:'КОНТЕНТ',t:'Готовьте контент под «'+p+'»',
      s:'Устойчивый рост '+fmtSign(a.g)+'% ('+fmtInt(a.vol)+'/мес). Посадочная страница и 2–3 публикации сейчас соберут трафик до пика спроса.',ph:r.ph});
    if((a.st==='boom'||a.st==='rising')&&r.s.assoc&&r.s.assoc.length)out.push({tone:'acc',tag:'АУДИТОРИИ',t:'Смежный интерес вокруг «'+p+'»',
      s:'Похожие запросы: '+r.s.assoc.slice(0,4).map(function(x){return'«'+x.phrase+'»'}).join(', ')+' — готовые сегменты и ключи для тестов.',ph:r.ph});
    if(a.st==='emerging')out.push({tone:'acc',tag:'НАБЛЮДАТЬ',t:'«'+p+'» оживает на низкой базе',
      s:'Рост '+fmtSign(a.g)+'%, но объём пока ~'+fmtInt(a.vol)+'/мес. Дёшево занять нишу заранее: черновик посадочной + минимальная кампания.',ph:r.ph});
    if(a.st==='seasonal')out.push({tone:'warn',tag:'СЕЗОН',t:'«'+p+'» — сезон, не тренд',
      s:'Год назад та же картина (YoY '+fmtSign(a.yoy)+'%). Планируйте кампанию к дате и поднимайте ставки за 2–3 недели до пика.',ph:r.ph});
    if(a.st==='falling')out.push({tone:'mut',tag:'БЮДЖЕТ',t:'Снижайте ставки по «'+p+'»',
      s:'Спрос '+fmtSign(a.g)+'% к базе. Перераспределите бюджет на растущие запросы из таблицы выше.',ph:r.ph});
  });
  return out.slice(0,8);
}
function trToIdea(title,text){
  state.ideas.unshift({id:uid(),title:title,text:text,created:Date.now()});
  save();toast('Добавлено в «Идеи» ✓');
}

/* ---------- UI: страница ---------- */
function trSelIds(rows){
  var have={};rows.forEach(function(r){have[r.ph.id]=1});
  var sel=(TR.ui.sel||[]).filter(function(id){return have[id]});
  if(!sel.length)sel=rows.slice(0,5).map(function(r){return r.ph.id});
  return sel;
}
function trAgo(ts){
  if(!ts)return'—';
  var m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'только что';
  if(m<60)return m+' мин назад';
  var h=Math.round(m/60);
  if(h<48)return h+' ч назад';
  return fmtDate(ts);
}

/* ---------- график ---------- */
function trDrawChart(host,rows,sel){
  var byId={};rows.forEach(function(r){byId[r.ph.id]=r});
  var per=TR.ui.period||26;
  var series=sel.map(function(id){return byId[id]}).filter(Boolean);
  if(!series.length){host.appendChild(el('div','trfall-n','Нет данных для графика.'));return}
  if(!window.Chart){
    if(window.__noCharts===true){
      host.appendChild(trFallChart(series,per));
      var nn=el('div','trfall-n','Chart.js не загрузился (нет интернета) — показан упрощённый график. Полный вернётся при следующем открытии с сетью.');
      host.appendChild(nn);
    }else{
      host.appendChild(el('div','trfall-n','Загружаю библиотеку графиков…'));
      window.__chartWait=function(){if(state.ui.view==='trends')renderView()};
    }
    return;
  }
  var cv=document.createElement('canvas');
  host.appendChild(cv);
  var css=getComputedStyle(document.body);
  function cvar(n,f){var v=css.getPropertyValue(n).trim();return v||f}
  var mut=cvar('--mut','#8a90a0'),line=cvar('--line','#e9eaef'),ink=cvar('--ink','#14161d'),surf=cvar('--surface','#fff');
  var pal=[cvar('--acc','#4a7cf5'),'#10b981','#f59e0b','#ec4899','#8b5cf6','#14b8a6','#f43f5e','#64748b'];
  var baseW=trWeekly(series[0].ph.id).slice(-per);
  var labels=baseW.map(function(x){var p=x.date.split('-');return p[2]+'.'+p[1]});
  var dsets=series.map(function(r,ix){
    var map={};trWeekly(r.ph.id).forEach(function(x){map[x.date]=x.count});
    var data=baseW.map(function(x){return map[x.date]!=null?map[x.date]:null});
    return{label:r.ph.phrase,data:data,borderColor:pal[ix%pal.length],
      backgroundColor:pal[ix%pal.length],spanGaps:true};
  });
  window._trChart=new Chart(cv,{
    type:'line',
    data:{labels:labels,datasets:dsets},
    options:{
      responsive:true,maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{color:mut,usePointStyle:true,pointStyle:'circle',boxWidth:7,boxHeight:7,font:{size:11,weight:'600'}}},
        tooltip:{backgroundColor:surf,titleColor:ink,bodyColor:ink,borderColor:line,borderWidth:1,padding:10,
          callbacks:{label:function(c){return ' '+c.dataset.label+': '+fmtInt(c.parsed.y)+' запр./нед'}}}
      },
      scales:{
        x:{ticks:{color:mut,maxTicksLimit:12,font:{size:10}},grid:{color:line,drawTicks:false}},
        y:{beginAtZero:true,ticks:{color:mut,font:{size:10},callback:function(v){return v>=1000?(Math.round(v/100)/10+'k'):v}},grid:{color:line,drawTicks:false}}
      },
      elements:{line:{tension:.35,borderWidth:2},point:{radius:0,hitRadius:10,hoverRadius:4}}
    }
  });
}
function trFallChart(series,per){
  var W=760,H=180,pad=6;
  var svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 '+W+' '+H);
  svg.setAttribute('class','sparkbig');
  svg.setAttribute('preserveAspectRatio','none');
  var pal=['var(--acc)','#10b981','#f59e0b','#ec4899','#8b5cf6','#14b8a6'];
  var mx=1;
  series.forEach(function(r){trWeekly(r.ph.id).slice(-per).forEach(function(x){if(x.count>mx)mx=x.count})});
  series.forEach(function(r,ix){
    var w=trWeekly(r.ph.id).slice(-per);
    if(w.length<2)return;
    var pts=w.map(function(x,i){
      var xx=pad+i/(w.length-1)*(W-2*pad);
      var yy=H-pad-(x.count/mx)*(H-2*pad);
      return xx.toFixed(1)+','+yy.toFixed(1);
    }).join(' ');
    var pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('points',pts);
    pl.setAttribute('fill','none');
    pl.setAttribute('stroke',pal[ix%pal.length]);
    pl.setAttribute('stroke-width','2');
    pl.setAttribute('stroke-linejoin','round');
    svg.appendChild(pl);
  });
  return svg;
}

/* ---------- меню строки / инфо / добавление ---------- */
function trAddPhrase(phrase,tag){
  phrase=String(phrase||'').trim();
  if(!phrase)return null;
  var n=trNorm(phrase);
  var dup=TR.phrases.some(function(p){return trNorm(p.phrase)===n});
  if(dup){toast('«'+phrase+'» уже отслеживается');return null}
  var ph={id:uid(),phrase:phrase,tag:String(tag||'').trim(),created:Date.now(),by:(CURRENT&&(CURRENT.name||CURRENT.login))||''};
  TR.phrases.push(ph);
  if(TR.demo){ /* в демо-режиме сразу рисуем правдоподобную серию */
    TR.snap[ph.id]={weekly:trGenSeries('rise',400+Math.round(trRnd(TR.phrases.length,7)*4000),TR.phrases.length+5),updated:Date.now(),top:[],assoc:[]};
  }
  trSave();
  return ph;
}
function openTrAdd(){

    var sp=el('div');sp.style.flex='1';
    var x=el('button','btn sq','✕');x.onclick=closeModal;
    head.appendChild(sp);head.appendChild(x);
    m.appendChild(head);
    var sec=el('div','sec');
    var pi=document.createElement('input');pi.className='in';pi.placeholder='например: нейросети для бизнеса';
    sec.appendChild(field('ПОИСКОВАЯ ФРАЗА',pi));
    var ti=document.createElement('input');ti.className='in';ti.placeholder='необязательно: группа/тег, например «ии» или «вк»';
    sec.appendChild(field('ТЕГ',ti));
    sec.appendChild(el('div','viewhint','Совет: берите фразы из 2–4 слов, как их набирают люди. Похожие формулировки система подтянет сама в «Кандидатов».'));
    m.appendChild(sec);
    var f=el('div','mfoot');

    var ok=el('button','btn acc','ДОБАВИТЬ');
    ok.onclick=function(){
      var ph=trAddPhrase(pi.value,ti.value);
      if(!ph)return;
      closeModal();renderView();
      if(WS_STATUS.tokenSet)syncOne(ph);

    f.appendChild(cancel);f.appendChild(ok);

/* ============================================================= */
/* ===== Живой фон: слой светящихся частиц (Canvas) ============= */
/*  Полностью самодостаточно. Отключается при reduce-motion и на  */
/*  слабых устройствах, ставится на паузу при скрытой вкладке,    */
/*  ограничивает DPR и перекрашивается под акцент темы.           */
/* ============================================================= */
(function(){
  var cv=document.getElementById('ambient-canvas');
  if(!cv||!cv.getContext)return;
  var mq=window.matchMedia?window.matchMedia('(prefers-reduced-motion:reduce)'):null;
  var weak=(navigator.deviceMemory&&navigator.deviceMemory<4)||
           (navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=2);
  if((mq&&mq.matches)||weak){cv.style.display='none';return;}
  var ctx=cv.getContext('2d');
  var DPR=Math.min(window.devicePixelRatio||1,1.5);
  var W=0,H=0,ps=[],raf=0,running=false,t=0,rgb=[120,150,255];

  /* мягкий спрайт-«огонёк» — рисуем один раз, потом только копируем */
  var SP=36,sprite=document.createElement('canvas');sprite.width=sprite.height=SP;
  var sx=sprite.getContext('2d');
  function paintSprite(){
    sx.clearRect(0,0,SP,SP);
    var g=sx.createRadialGradient(SP/2,SP/2,0,SP/2,SP/2,SP/2);
    g.addColorStop(0,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',1)');
    g.addColorStop(1,'rgba('+rgb[0]+','+rgb[1]+','+rgb[2]+',0)');
    sx.fillStyle=g;sx.fillRect(0,0,SP,SP);
  }
  function readAccent(){
    try{
      var v=getComputedStyle(document.body).getPropertyValue('--acc').trim()||'#4a7cf5';
      if(v.charAt(0)==='#'){var h=v.slice(1);
        if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
        rgb=[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
      else{var m=v.match(/(\d+)[,\s]+(\d+)[,\s]+(\d+)/);if(m)rgb=[+m[1],+m[2],+m[3]];}
    }catch(e){}
    paintSprite();
  }
  function seed(){
    var n=Math.min(60,Math.max(16,Math.round(W*H/(28000*DPR))));
    ps=[];
    for(var i=0;i<n;i++)ps.push({
      x:Math.random()*W, y:Math.random()*H,
      r:(Math.random()*1.7+0.7)*DPR,
      vy:(Math.random()*0.20+0.05)*DPR,
      ph:Math.random()*6.283, amp:(Math.random()*0.5+0.2)*DPR,
      a:Math.random()*0.10+0.03
    });
  }
  function resize(){
    W=Math.floor(innerWidth*DPR);H=Math.floor(innerHeight*DPR);
    cv.width=W;cv.height=H;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';
    seed();
  }
  function frame(){
    raf=requestAnimationFrame(frame);
    t+=0.006;ctx.clearRect(0,0,W,H);
    for(var i=0;i<ps.length;i++){
      var p=ps[i];
      p.y-=p.vy;p.x+=Math.sin(t+p.ph)*p.amp*0.4;
      if(p.y<-6){p.y=H+6;p.x=Math.random()*W;}
      if(p.x<-6)p.x=W+6;else if(p.x>W+6)p.x=-6;
      var s=p.r*6;ctx.globalAlpha=p.a;
      ctx.drawImage(sprite,p.x-s/2,p.y-s/2,s,s);
    }
    ctx.globalAlpha=1;
  }
  function start(){if(running)return;running=true;raf=requestAnimationFrame(frame);}
  function stop(){running=false;cancelAnimationFrame(raf);}
  var rt;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(resize,200);});
  document.addEventListener('visibilitychange',function(){document.hidden?stop():start();});
  if(window.MutationObserver){
    new MutationObserver(readAccent).observe(document.body,{attributes:true,attributeFilter:['data-theme','style']});
  }
  readAccent();resize();start();
})();

/* ===== Пет-помощник + умное меню ============================= */
/*  Живёт слева снизу: моргает, «дышит», следит за курсором.      */
/*  Меню — стеклянная панель, которая переиспользует ТОЛЬКО       */
/*  существующие контролы приложения (клик по табам/кнопкам).    */
/* ============================================================= */
(function(){
  if(!document.body||document.getElementById('petDock'))return;
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  var VLBL={projects:'Проекты',ideas:'Идеи',calendar:'Календарь',trends:'Аналитика',digest:'Дайджест',alert:'Alert'};
  function ic(inner){return '<span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg></span>';}
  function clickId(id){var b=document.getElementById(id);if(b)b.click();}

  /* ---------------- ИНТЕГРАЦИЯ: Qtickets → Google Sheets ----------------
     Логика расчёта из Colab-ноутбука живёт на сервере (integrations/qtickets),
     приложение только запускает её и показывает отчёт. Выгрузка читает все
     заказы и идёт минутами, поэтому работаем асинхронно: запуск отдаёт job_id,
     дальше опрашиваем статус и рисуем прогресс.
     Настройка — QT_URL и QT_KEY в config.php (см. INTEGRATIONS.md).      */
  var qtJob=null,qtPoll=null;
  function runQtickets(tile){
    if(qtJob){toast('Выгрузка уже идёт — дождитесь отчёта');return;}
    if(tile)tile.classList.add('busy');
    toast('Запускаю выгрузку Qtickets → Google Sheets…');
    srvCall('qtickets_run',{apply:true}).then(function(r){
      qtJob=r&&r.job_id;
      if(!qtJob){qtDone(tile);toast('Сервис не вернул номер задачи',true);return;}
      if(r.already_running)toast('Подключаюсь к уже запущенной выгрузке…');
      qtWatch(tile);
    },function(e){
      qtDone(tile);
      toast('Не удалось запустить: '+((e&&e.message)||'нет связи'),true,6000);
    });
  }
  function qtDone(tile){qtJob=null;clearTimeout(qtPoll);if(tile)tile.classList.remove('busy');}
  function qtWatch(tile){
    qtPoll=setTimeout(function(){
      srvCall('qtickets_status',{job_id:qtJob}).then(function(s){
        if(!s){qtDone(tile);return;}
        if(s.state==='running'){
          toast((s.stage||'Работаю…')+(s.pct?(' · '+s.pct+'%'):''),false,4000);
          qtWatch(tile);return;
        }
        qtDone(tile);
        if(s.state==='error'){toast('Выгрузка не удалась: '+(s.error||'ошибка'),true,7000);return;}
        qtReport(s.report||{});
      },function(e){
        qtDone(tile);
        toast('Потерял связь с выгрузкой: '+((e&&e.message)||''),true,6000);
      });
    },3000);
  }
  /* Отчёт: если проблем нет — «всё сработано», иначе список мест,
     которые надо посмотреть глазами. */
  function qtReport(rep){
    close();                                   /* убираем меню — отчёт выходит на первый план */
    var probs=(rep&&rep.problems)||[],okAll=probs.length===0;
    toast(okAll?('Готово ✓ Заполнено ячеек: '+(rep.written||0))
               :('Готово, но есть замечания: '+probs.length),!okAll,5000);
    openModal(function(m){
      var h=el('div','mhead');
      h.appendChild(el('div','dtitle',okAll?'Выгрузка прошла успешно':'Выгрузка завершена — есть что проверить'));

        c.appendChild(row);c.appendChild(el('div','stval',String(val)));return c;
      }
      st.appendChild(card('Заполнено ячеек',rep.written||0,'ok'));
      st.appendChild(card('Листов обработано',(rep.sheets||[]).length,'acc'));
      st.appendChild(card('Замечаний',probs.length,probs.length?'warn':'ok'));
      st.appendChild(card('Заказов прочитано',rep.orders||0,'mut'));
      m.appendChild(st);

      var sec=el('div','sec');
      if(okAll){
        var okBox=el('div','al-empty','Всё сработано: расхождений нет, пустые ячейки Z/AB заполнены. '
          +'Заполненные ранее значения не трогали.');

      }else{
        sec.appendChild(el('div','sect','ТРЕБУЕТ ВНИМАНИЯ'));
        probs.forEach(function(p){
          var row=el('div','al-row'+(p.type==='mismatch'?'':' soft'));
          var main=el('div','al-main');
          main.appendChild(el('div','al-txt',p.text||''));
          main.appendChild(el('div','al-meta',p.type==='mismatch'
            ?'расхождение с таблицей — значение оставлено как было'
            :'лист пропущен: не нашёл ровно один показ QTickets'));
          row.appendChild(main);sec.appendChild(row);
        });
      }
      m.appendChild(sec);

      if(rep.sheets&&rep.sheets.length){
        var s2=el('div','sec');
        s2.appendChild(el('div','sect','ЛИСТЫ'));
        rep.sheets.forEach(function(s){
          var r=el('div','mrow');
          r.appendChild(el('span','lbl',s.tab));
          r.appendChild(el('span','mval',(s.written||0)+' из '+(s.to_write||0)+' ячеек'));
          s2.appendChild(r);
        });
        m.appendChild(s2);
      }

      var f=el('div','mfoot'),ok=el('button','btn acc','ПОНЯТНО');
      ok.onclick=closeModal;f.appendChild(ok);
      if(rep.sheet_title)f.appendChild(el('span','autosave',rep.sheet_title));
      m.appendChild(f);
    });
  }

  /* ======================= МЕНЮ ПЕТА =======================
     Чтобы добавить пункт — просто допишите объект в массив.
     Поля: label — подпись; icon — содержимое SVG 24×24;
           view  — перейти в раздел приложения (необязательно);
           run   — своя функция, получает саму плитку (необязательно);
           badge — 'alert', чтобы показывать счётчик (необязательно).
     Больше ничего править не нужно: сетка, анимация, подсветка
