     ========================================================= */
  var PET_MENU=[
    {view:'trends',label:'Отслежиратор',icon:'<path d="M3 17l6-6 4 4 7-8M14 7h6v6"/>'},
    {view:'digest',label:'Дайджест',icon:'<path d="M3 10.5l14-6v14l-14-6v-2zM7 14.5v3.5a2 2 0 0 0 4 0v-2M17 8.5a4 4 0 0 1 0 6"/>'},
    {view:'alert',label:'Alert',badge:'alert',icon:'<path d="M18 9a6 6 0 1 0-12 0c0 6-2.5 7-2.5 7h17S18 15 18 9zM10.3 20a2 2 0 0 0 3.4 0"/>'},
    {run:runQtickets,label:'Qtickets',icon:'<rect x="4" y="8" width="16" height="12" rx="4"/><path d="M12 8V4.5M8.5 14h.01M15.5 14h.01M2.5 13.5v3M21.5 13.5v3"/><circle cx="12" cy="3.4" r="1.3"/>'},
    {run:function(){clickId('btnTheme');},label:'Оформление',icon:'<path d="M12 3a9 9 0 1 0 0 18c1.5 0 2-.9 2-2 0-1.4-1-1.7-1-3 0-1.2 1-2 2.3-2H17a4 4 0 0 0 4-4c0-4-4.5-7-9-7z"/><circle cx="7.5" cy="11" r=".6"/><circle cx="10" cy="7.5" r=".6"/><circle cx="14.5" cy="7.5" r=".6"/>'},
    {run:function(){var q=document.getElementById('q');if(q){try{q.focus();q.select();}catch(e){}}},label:'Поиск',icon:'<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'}
  ];

  var dock=document.createElement('div');dock.id='petDock';
  dock.innerHTML=
    '<button class="pet-btn" id="petBtn" aria-label="Помощник Place" title="Помощник">'
    +'<span class="pet-glow"></span>'
    +'<svg class="pet-face" viewBox="0 0 64 64" fill="none" aria-hidden="true">'
    +'<line class="pet-antenna" x1="32" y1="15" x2="32" y2="8"/><circle class="pet-led" cx="32" cy="6" r="3"/>'
    +'<rect x="9" y="14" width="46" height="42" rx="15" fill="var(--acc)"/>'
    +'<rect class="pet-head-hi" x="9" y="14" width="46" height="21" rx="15"/>'
    +'<rect class="pet-shade" x="9" y="41" width="46" height="15" rx="12"/>'
    +'<rect class="pet-visor" x="15" y="22" width="34" height="24" rx="12"/>'
    +'<circle cx="9" cy="35" r="2" fill="var(--acc)"/><circle cx="55" cy="35" r="2" fill="var(--acc)"/>'
    +'<g id="petEyes"><rect class="pet-eye" x="22" y="30" width="6.5" height="10" rx="3.2"/><rect class="pet-eye" x="35.5" y="30" width="6.5" height="10" rx="3.2"/>'
    +'<g id="petPupils"><circle class="pet-pupil" cx="25.2" cy="35.5" r="1.9"/><circle class="pet-pupil" cx="38.7" cy="35.5" r="1.9"/></g></g>'
    +'<rect class="pet-mouth" x="27" y="49" width="10" height="2.4" rx="1.2"/></svg></button>'
    +'<div class="pet-panel" id="petPanel">'
    +'<div class="pp-head"><span class="pp-emblem"></span><div><div class="pp-hi" id="ppHi">Привет</div><div class="pp-sub">Куда идём?</div></div><button class="pp-x" id="ppX" aria-label="Закрыть">×</button></div>'
    +'<div class="pp-lbl" id="ppRecentLbl">Недавнее</div><div class="pp-recent" id="ppRecent"></div>'
    +'<div class="pp-grid" id="ppNav"></div></div>';
  document.body.appendChild(dock);

  var petBtn=document.getElementById('petBtn'),panel=document.getElementById('petPanel'),
      face=petBtn.querySelector('.pet-face'),eyes=document.getElementById('petEyes'),
      pupils=document.getElementById('petPupils'),navWrap=document.getElementById('ppNav'),
      recWrap=document.getElementById('ppRecent'),
      recLbl=document.getElementById('ppRecentLbl');

  function curView(){try{return (state&&state.ui&&state.ui.view)||'projects';}catch(e){return 'projects';}}
  var RKEY='pi_pet_recent',recent=[];
  try{recent=JSON.parse(localStorage.getItem(RKEY))||[];}catch(e){recent=[];}
  function pushRecent(v){recent=[v].concat(recent.filter(function(x){return x!==v;})).slice(0,4);
    try{localStorage.setItem(RKEY,JSON.stringify(recent));}catch(e){}}
  function goView(v){var tab=document.querySelector('.tab[data-view="'+v+'"]');
    if(tab)tab.click();else{try{state.ui.view=v;save();renderApp();}catch(e){}}
    pushRecent(v);}

  PET_MENU.forEach(function(m,idx){
    var b=document.createElement('button');b.className='pet-tile';
    if(m.view)b.dataset.view=m.view;
    if(m.badge)b.dataset.badge=m.badge;
    b.title=m.label;b.setAttribute('aria-label',m.label);
    b.style.animationDelay=(idx*0.03)+'s';
    b.innerHTML=ic(m.icon)+'<span class="t">'+m.label+'</span>';
    b.onclick=function(){
      if(m.view){goView(m.view);nod();close();}
      else if(m.run){nod();m.run(b);}       /* меню не закрываем — виден прогресс */
    };
    navWrap.appendChild(b);
  });

  function renderRecent(){var cv=curView();var items=recent.filter(function(v){return v!==cv&&VLBL[v];});
    recWrap.innerHTML='';var show=items.length>0;recWrap.style.display=show?'':'none';recLbl.style.display=show?'':'none';
    items.slice(0,4).forEach(function(v,idx){var b=document.createElement('button');b.className='pp-rc';b.textContent=VLBL[v];
      b.style.animationDelay=(idx*0.03)+'s';b.onclick=function(){goView(v);nod();close();};recWrap.appendChild(b);});}
  function markActive(){var cv=curView();var bs=navWrap.querySelectorAll('.pet-tile');
    for(var i=0;i<bs.length;i++)bs[i].classList.toggle('on',bs[i].dataset.view===cv);}
  function greet(){var h=new Date().getHours();return h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер';}

  function open(){document.getElementById('ppHi').textContent=greet();renderRecent();markActive();panel.classList.add('open');}
  function close(){panel.classList.remove('open');}
  petBtn.onclick=function(e){e.stopPropagation();panel.classList.contains('open')?close():open();};
  document.getElementById('ppX').onclick=function(e){e.stopPropagation();close();};
  document.addEventListener('mousedown',function(e){if(panel.classList.contains('open')&&!dock.contains(e.target))close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});

  function nod(){if(reduce)return;face.classList.remove('nod');void face.offsetWidth;face.classList.add('nod');
    setTimeout(function(){face.classList.remove('nod');},560);}

  if(!reduce){
    (function blink(){eyes.classList.add('blink');setTimeout(function(){eyes.classList.remove('blink');},130);
      setTimeout(blink,2600+Math.random()*4200);})();
    var mx=0,my=0,pend=false;
    function look(){pend=false;var r=petBtn.getBoundingClientRect();var cx=r.left+r.width/2,cy=r.top+r.height/2;
      var dx=mx-cx,dy=my-cy,d=Math.sqrt(dx*dx+dy*dy)||1,mag=Math.min(1.5,d/70);
      pupils.setAttribute('transform','translate('+(dx/d*mag).toFixed(2)+' '+(dy/d*mag).toFixed(2)+')');}
    window.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;if(!pend){pend=true;requestAnimationFrame(look);}},{passive:true});
  }
})();

/* ============================================================= */
/* ===== Смарт-навигация: пет реагирует на события ============= */
/*  Зеркалит счётчик приложения (#alertBadge, который обновляет  */
/*  updateAlertTab при каждом renderApp) — без своей логики.     */
/* ============================================================= */
(function(){
  var dock=document.getElementById('petDock'),petBtn=document.getElementById('petBtn'),
      src=document.getElementById('alertBadge');
  if(!dock||!petBtn)return;
  var badge=document.createElement('span');badge.className='pet-badge';petBtn.appendChild(badge);
  var hint=document.createElement('div');hint.className='pet-hint';dock.appendChild(hint);
  var last=-1,hintT=null,dismissed=0;
  function count(){try{if(typeof alertCount==='function')return alertCount()|0;}catch(e){}
    var t=src?parseInt(src.textContent,10):0;return isNaN(t)?0:t;}
  function word(n){try{return plur(n,'задача требует','задачи требуют','задач требуют');}catch(e){return 'задач требуют';}}
  function goAlert(){var t=document.querySelector('.tab[data-view="alert"]');if(t)t.click();}
  function hide(){hint.classList.remove('on');dismissed=Date.now();}
  function showHint(n){
    if(Date.now()-dismissed<60000)return;
    var pnl=document.getElementById('petPanel');if(pnl&&pnl.classList.contains('open'))return;
    if(document.body.classList.contains('noauth'))return;
    var sb=dock.querySelector('.pet-say');if(sb)sb.classList.remove('on'); /* важное важнее болтовни */
    hint.innerHTML='';var s=document.createElement('span');
    s.innerHTML='🚨 <b>'+n+'</b> '+word(n)+' внимания';hint.appendChild(s);
    hint.onclick=function(){hide();goAlert();};
    hint.classList.add('on');clearTimeout(hintT);hintT=setTimeout(hide,6500);
  }
  function update(){
    var n=count();
    badge.textContent=n>99?'99+':String(n);badge.classList.toggle('on',n>0);
    var na=dock.querySelector('.pet-tile[data-badge="alert"]');
    if(na){var nb=na.querySelector('.pp-navbadge');
      if(n>0){if(!nb){nb=document.createElement('span');nb.className='pp-navbadge';na.appendChild(nb);}nb.textContent=n;}
      else if(nb){nb.parentNode.removeChild(nb);}}
    if(last>=0&&n>last)showHint(n);
    last=n;
  }
  if(window.MutationObserver&&src)
    new MutationObserver(update).observe(src,{childList:true,characterData:true,subtree:true,attributes:true});
  var pnl0=document.getElementById('petPanel');
  if(pnl0&&window.MutationObserver)
    new MutationObserver(function(){if(pnl0.classList.contains('open'))hide();}).observe(pnl0,{attributes:true,attributeFilter:['class']});
  update();
  setTimeout(function(){var n=count();if(n>0&&!document.body.classList.contains('noauth')){last=0;showHint(n);last=n;}},2600);
})();

/* ============================================================= */
/* ===== Характер пета: микродвижения и добрые фразы =========== */
/*  Раз в ~20 сек пет говорит короткую тёплую фразу и оживает    */
/*  небольшим движением. Молчит, когда может помешать: открыто   */
/*  меню/модалка, идёт ввод текста, висит важное уведомление,    */
/*  вкладка свёрнута или включён prefers-reduced-motion.         */
/* ============================================================= */
(function(){
  var dock=document.getElementById('petDock'),petBtn=document.getElementById('petBtn');
  if(!dock||!petBtn)return;
  var face=petBtn.querySelector('.pet-face'),hint=dock.querySelector('.pet-hint'),
      panel=document.getElementById('petPanel');
  var reduce=!!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion:reduce)').matches);
  var say=document.createElement('div');say.className='pet-say';dock.appendChild(say);

  var GENERAL=[
    'У тебя всё получится 💪','Ты сегодня отлично справляешься','Маленький шаг — тоже прогресс',
    'Не забывай про паузы ☕','Я рядом, если что','Хороший день для новой идеи ✨',
    'Ты молодец, правда','Один шаг за раз — и всё сложится','Сделано лучше, чем идеально',
    'Спину ровнее, плечи вниз 🙂','Глаза устали? Посмотри вдаль 20 секунд','Верю в тебя!',
    'Дыши глубже — всё под контролем','Ты уже сделал больше, чем кажется'
  ];
  var MORNING=['Доброе утро! Начнём с малого ☀️','Утро — лучшее время для сложной задачи','С добрым утром! Кофе уже? ☕'];
  var EVENING=['Вечер — время подвести итоги 🌇','Ты много успел сегодня','Скоро отдых — ты заслужил'];
  var NIGHT=['Поздно уже… не засиживайся 🌙','Отдых — тоже работа','Ночью идеи приходят, но сон важнее 💤'];
  function pool(){var h=new Date().getHours();
    if(h<5||h>=23)return NIGHT.concat(GENERAL);
    if(h<11)return MORNING.concat(GENERAL);
    if(h>=18)return EVENING.concat(GENERAL);
    return GENERAL;}
  var lastMsg='';
  function pick(){var p=pool(),m=p[0];
    for(var i=0;i<6;i++){m=p[Math.floor(Math.random()*p.length)];if(m!==lastMsg)break;}
    lastMsg=m;return m;}

  function busy(){
    if(document.hidden)return true;
    if(document.body.classList.contains('noauth'))return true;
    if(panel&&panel.classList.contains('open'))return true;
    if(hint&&hint.classList.contains('on'))return true;
    var ov=document.getElementById('overlay');if(ov&&!ov.classList.contains('hidden'))return true;
    if(document.querySelector('.lightbox'))return true;
    var ae=document.activeElement;                       /* не отвлекаем во время ввода */
    if(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))return true;
    return false;
  }
  var sayT=null;
  function hush(){say.classList.remove('on');clearTimeout(sayT);}
  function speak(msg){
    if(busy())return;
    say.textContent=msg||pick();say.classList.add('on');move('perk');
    clearTimeout(sayT);sayT=setTimeout(hush,5600);
  }
  say.onclick=function(e){e.stopPropagation();hush();};

  var MOVES=['tilt','hop','wiggle'],moveT=null;
  function move(kind){
    if(reduce)return;
    var k=kind||MOVES[Math.floor(Math.random()*MOVES.length)];
    face.classList.remove('tilt','hop','wiggle','perk');void face.offsetWidth;
    face.classList.add(k);clearTimeout(moveT);
    moveT=setTimeout(function(){face.classList.remove(k);},1150);
  }

  (function talkLoop(){setTimeout(function(){speak();talkLoop();},20000+Math.random()*7000);})();
  if(!reduce)(function idleLoop(){setTimeout(function(){
    if(!busy())move();idleLoop();},9000+Math.random()*9000);})();

  document.addEventListener('visibilitychange',function(){if(document.hidden)hush();});
  if(panel&&window.MutationObserver)
    new MutationObserver(function(){if(panel.classList.contains('open'))hush();})
      .observe(panel,{attributes:true,attributeFilter:['class']});
  setTimeout(function(){speak('Привет! Я рядом, если что 👋');},4200);
})();

/* ============================================================= */
/* ===== Скелет первичной загрузки ============================= */
/*  Показывается только пока грузится сессия (вернувшийся        */
/*  пользователь с токеном). Снимается на первом рендере,        */
/*  при показе экрана входа или по страховочному таймауту.       */
/* ============================================================= */
(function(){
  if(document.getElementById('bootSkeleton'))return;
  var view=document.getElementById('view'),authScreen=document.getElementById('authScreen'),body=document.body;
  if(!view)return;
  // Показываем только при «тихом» переподключении по токену (вернувшийся
  // пользователь): вместо простой карточки «Подключаюсь…» — премиальный
  // скелет-каркас приложения.
  var hasTok=false;try{hasTok=!!localStorage.getItem('place_token');}catch(e){}
  var reconnecting=hasTok&&body.classList.contains('noauth')&&!body.classList.contains('authed');
  if(!reconnecting)return;
  var rows='';for(var i=0;i<6;i++)rows+='<div class="sk-navrow"><span class="sk-dot sk-shimmer"></span><span class="sk-line sk-shimmer"></span></div>';
  var sk=document.createElement('div');sk.id='bootSkeleton';sk.setAttribute('aria-hidden','true');
  sk.innerHTML=
    '<div class="sk-sb"><div class="sk-brand"><span class="sk-logo sk-shimmer"></span><span class="sk-line sk-shimmer" style="max-width:90px"></span></div>'
    +'<div class="sk-navs">'+rows+'</div></div>'
    +'<div class="sk-shell"><div class="sk-top"><span class="sk-search sk-shimmer"></span></div>'
    +'<div class="sk-main"><span class="sk-title sk-shimmer"></span>'
    +'<div class="sk-stats"><span class="sk-stat sk-shimmer"></span><span class="sk-stat sk-shimmer"></span><span class="sk-stat sk-shimmer"></span></div>'
    +'<div class="sk-cards"><span class="sk-card sk-shimmer"></span><span class="sk-card sk-shimmer"></span><span class="sk-card sk-shimmer"></span><span class="sk-card sk-shimmer"></span></div>'
    +'</div></div>';
  body.classList.add('booting');document.body.appendChild(sk);
  var done=false,obs=[];
  function finish(){if(done)return;done=true;body.classList.remove('booting');sk.classList.add('fade');
    setTimeout(function(){if(sk.parentNode)sk.parentNode.removeChild(sk);},430);
    obs.forEach(function(o){o.disconnect();});clearTimeout(safety);}
  function watch(target,opts,test){if(!target||!window.MutationObserver)return;
    var o=new MutationObserver(function(){if(test())finish();});o.observe(target,opts);obs.push(o);}
  // успех: тело получает класс authed / #view заполнен рендером
  watch(body,{attributes:true,attributeFilter:['class']},function(){return body.classList.contains('authed');});
  watch(view,{childList:true},function(){return view.childNodes.length>0;});
  // неудача: сессия отклонена — приложение перерисовывает экран входа (форма логина)
  watch(authScreen,{childList:true,subtree:true},function(){return true;});
  var safety=setTimeout(finish,6000);
})();

</script>
