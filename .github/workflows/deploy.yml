name: Deploy to GitHub Pages

# Собирает приложение и публикует его на GitHub Pages.
# Что нужно один раз включить вручную, чтобы это заработало:
#   1) Репозиторий должен быть ПУБЛИЧНЫМ (Settings → General → Change visibility),
#      либо аккаунт на платном тарифе GitHub.
#   2) Settings → Pages → Source (Источник) → «GitHub Actions».
# После этого каждый пуш в ветку публикует приложение автоматически.
#
# Триггер намеренно широкий: раньше здесь стояла одна конкретная рабочая ветка,
# она устарела, и сборка молча перестала запускаться — на Pages месяцами висела
# старая версия. Публикуется та ветка, в которую пушнули последней
# (concurrency ниже отменяет предыдущий деплой).

on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
